<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SmartEdu | Alunos</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
    --bg:#f4f7fb;
    --card:#fff;
    --text:#172033;
    --muted:#718096;
    --line:#e5eaf1;
    --primary:#2563eb;
    --primary-dark:#1d4ed8;
    --success:#16a34a;
    --danger:#dc2626;
    --warning:#d97706;
    --shadow:0 12px 35px rgba(15,23,42,.08);
    --radius:18px;
}
body{
    font-family:Segoe UI,Arial,sans-serif;
    background:var(--bg);
    color:var(--text);
    min-height:100vh;
}
.header{
    height:72px;
    background:#fff;
    border-bottom:1px solid var(--line);
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 32px;
    position:sticky;
    top:0;
    z-index:20;
}
.brand{
    display:flex;
    align-items:center;
    gap:12px;
    font-weight:800;
    font-size:21px;
}
.logo{
    width:40px;
    height:40px;
    border-radius:12px;
    background:linear-gradient(135deg,#2563eb,#7c3aed);
    color:#fff;
    display:grid;
    place-items:center;
    font-weight:900;
}
.header-actions{
    display:flex;
    gap:10px;
}
.container{
    max-width:1450px;
    margin:auto;
    padding:30px;
}
.page-head{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:20px;
    margin-bottom:25px;
}
.page-head h1{
    font-size:30px;
    margin-bottom:6px;
}
.page-head p{
    color:var(--muted);
}
button{
    border:0;
    cursor:pointer;
    font-family:inherit;
}
.btn{
    padding:11px 17px;
    border-radius:11px;
    font-weight:700;
    transition:.2s;
}
.btn:hover{transform:translateY(-1px)}
.btn-primary{
    background:var(--primary);
    color:#fff;
}
.btn-primary:hover{background:var(--primary-dark)}
.btn-light{
    background:#eef2f7;
    color:#334155;
}
.btn-danger{
    background:#fee2e2;
    color:#991b1b;
}
.btn-success{
    background:#dcfce7;
    color:#166534;
}
.stats{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:18px;
    margin-bottom:25px;
}
.stat{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:22px;
    box-shadow:var(--shadow);
}
.stat-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:15px;
}
.stat-icon{
    width:44px;
    height:44px;
    border-radius:13px;
    display:grid;
    place-items:center;
    font-size:20px;
    background:#eff6ff;
}
.stat span{
    color:var(--muted);
    font-size:14px;
}
.stat strong{
    display:block;
    font-size:29px;
    margin-top:5px;
}
.panel{
    background:#fff;
    border:1px solid var(--line);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    overflow:hidden;
}
.toolbar{
    padding:20px;
    display:flex;
    gap:12px;
    flex-wrap:wrap;
    border-bottom:1px solid var(--line);
}
.input,.select{
    height:44px;
    border:1px solid #dbe2ea;
    border-radius:10px;
    padding:0 13px;
    outline:none;
    background:#fff;
    color:var(--text);
}
.input:focus,.select:focus{
    border-color:var(--primary);
    box-shadow:0 0 0 3px rgba(37,99,235,.1);
}
.search{
    flex:1;
    min-width:240px;
}
.table-wrap{overflow:auto}
table{
    width:100%;
    border-collapse:collapse;
    min-width:1000px;
}
th,td{
    padding:16px 18px;
    text-align:left;
    border-bottom:1px solid var(--line);
    font-size:14px;
}
th{
    background:#f8fafc;
    color:#64748b;
    font-size:12px;
    text-transform:uppercase;
    letter-spacing:.05em;
}
tr:hover td{background:#fafcff}
.badge{
    display:inline-flex;
    align-items:center;
    padding:6px 10px;
    border-radius:999px;
    font-size:12px;
    font-weight:700;
}
.badge-active{
    background:#dcfce7;
    color:#166534;
}
.badge-inactive{
    background:#fee2e2;
    color:#991b1b;
}
.rfid{
    font-family:Consolas,monospace;
    background:#f1f5f9;
    padding:5px 8px;
    border-radius:7px;
}
.actions{
    display:flex;
    gap:7px;
}
.icon-btn{
    width:35px;
    height:35px;
    border-radius:9px;
    display:grid;
    place-items:center;
}
.empty{
    padding:60px 20px;
    text-align:center;
    color:var(--muted);
}
.loading{
    padding:45px;
    text-align:center;
    color:var(--muted);
}
.modal{
    position:fixed;
    inset:0;
    background:rgba(15,23,42,.55);
    display:none;
    align-items:center;
    justify-content:center;
    padding:20px;
    z-index:100;
}
.modal.show{display:flex}
.modal-box{
    width:100%;
    max-width:720px;
    background:#fff;
    border-radius:20px;
    box-shadow:0 30px 80px rgba(0,0,0,.25);
    overflow:hidden;
}
.modal-head{
    padding:22px 25px;
    border-bottom:1px solid var(--line);
    display:flex;
    justify-content:space-between;
    align-items:center;
}
.modal-head h2{font-size:20px}
.close{
    background:#f1f5f9;
    width:36px;
    height:36px;
    border-radius:10px;
    font-size:20px;
}
.form{
    padding:25px;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:17px;
}
.field{display:flex;flex-direction:column;gap:7px}
.field.full{grid-column:1/-1}
.field label{
    font-size:13px;
    font-weight:700;
    color:#475569;
}
.field input,.field select{
    height:44px;
    border:1px solid #dbe2ea;
    border-radius:10px;
    padding:0 12px;
    outline:none;
}
.modal-foot{
    padding:18px 25px;
    border-top:1px solid var(--line);
    display:flex;
    justify-content:flex-end;
    gap:10px;
}
.toast{
    position:fixed;
    right:25px;
    bottom:25px;
    min-width:280px;
    max-width:420px;
    padding:15px 18px;
    border-radius:12px;
    color:#fff;
    background:#172033;
    box-shadow:0 15px 40px rgba(0,0,0,.2);
    transform:translateY(120px);
    opacity:0;
    transition:.3s;
    z-index:200;
}
.toast.show{
    transform:translateY(0);
    opacity:1;
}
.toast.success{background:#15803d}
.toast.error{background:#b91c1c}

@media(max-width:1000px){
    .stats{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:650px){
    .header{padding:0 15px}
    .container{padding:18px}
    .page-head{flex-direction:column}
    .stats{grid-template-columns:1fr}
    .form{grid-template-columns:1fr}
    .field.full{grid-column:auto}
}
</style>
</head>

<body>

<header class="header">
    <div class="brand">
        <div class="logo">S</div>
        <span>SmartEdu</span>
    </div>

    <div class="header-actions">
        <button class="btn btn-light" onclick="location.href='/dashboard/'">
            Dashboard
        </button>
    </div>
</header>

<main class="container">

    <section class="page-head">
        <div>
            <h1>Gestão de Alunos</h1>
            <p>Gerencie estudantes, turmas, estado académico e cartões RFID.</p>
        </div>

        <button class="btn btn-primary" onclick="openCreate()">
            + Novo aluno
        </button>
    </section>

    <section class="stats">

        <div class="stat">
            <div class="stat-top">
                <span>Total de alunos</span>
                <div class="stat-icon">👨‍🎓</div>
            </div>
            <strong id="totalStudents">0</strong>
        </div>

        <div class="stat">
            <div class="stat-top">
                <span>Ativos</span>
                <div class="stat-icon">✓</div>
            </div>
            <strong id="activeStudents">0</strong>
        </div>

        <div class="stat">
            <div class="stat-top">
                <span>Inativos</span>
                <div class="stat-icon">⊘</div>
            </div>
            <strong id="inactiveStudents">0</strong>
        </div>

        <div class="stat">
            <div class="stat-top">
                <span>Com RFID</span>
                <div class="stat-icon">📡</div>
            </div>
            <strong id="rfidStudents">0</strong>
        </div>

    </section>

    <section class="panel">

        <div class="toolbar">
            <input
                id="search"
                class="input search"
                placeholder="Pesquisar por nome, número, email ou curso..."
                oninput="render()"
            >

            <select id="statusFilter" class="select" onchange="render()">
                <option value="">Todos os estados</option>
                <option value="active">Ativos</option>
                <option value="inactive">Inativos</option>
            </select>

            <button class="btn btn-light" onclick="loadStudents()">
                ↻ Atualizar
            </button>
        </div>

        <div class="table-wrap">
            <table>
                <thead>
                    <tr>
                        <th>Nº estudante</th>
                        <th>Nome</th>
                        <th>Email</th>
                        <th>Curso</th>
                        <th>Turma</th>
                        <th>RFID</th>
                        <th>Estado</th>
                        <th>Ações</th>
                    </tr>
                </thead>

                <tbody id="studentsBody">
                    <tr>
                        <td colspan="8" class="loading">A carregar alunos...</td>
                    </tr>
                </tbody>
            </table>
        </div>

    </section>

</main>

<div id="modal" class="modal">

    <div class="modal-box">

        <div class="modal-head">
            <h2 id="modalTitle">Novo aluno</h2>
            <button class="close" onclick="closeModal()">×</button>
        </div>

        <form id="studentForm" class="form">

            <input type="hidden" id="studentId">

            <div class="field">
                <label>Número do estudante *</label>
                <input id="student_number" required>
            </div>

            <div class="field">
                <label>Nome completo *</label>
                <input id="name" required>
            </div>

            <div class="field">
                <label>Email *</label>
                <input id="email" type="email" required>
            </div>

            <div class="field">
                <label>Curso *</label>
                <input id="course" required>
            </div>

            <div class="field">
                <label>Turma</label>
                <input id="class_name">
            </div>

            <div class="field">
                <label>Cartão RFID</label>
                <input id="rfid_card_id" placeholder="Ex.: RFID-001">
            </div>

            <div class="field full">
                <label>Estado</label>
                <select id="status">
                    <option value="active">Ativo</option>
                    <option value="inactive">Inativo</option>
                </select>
            </div>

        </form>

        <div class="modal-foot">
            <button class="btn btn-light" onclick="closeModal()">
                Cancelar
            </button>

            <button class="btn btn-primary" onclick="saveStudent()">
                Guardar aluno
            </button>
        </div>

    </div>

</div>

<div id="toast" class="toast"></div>

<script>

const API = "/api/v1/students/";
let students = [];

function showToast(message, type = "") {
    const toast = document.getElementById("toast");
    toast.textContent = message;
    toast.className = "toast show " + type;

    setTimeout(() => {
        toast.className = "toast";
    }, 3500);
}

function escapeHtml(value) {
    return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}

function extractList(payload) {
    if (Array.isArray(payload)) return payload;

    if (payload && Array.isArray(payload.data))
        return payload.data;

    if (payload && payload.data && Array.isArray(payload.data.students))
        return payload.data.students;

    if (payload && Array.isArray(payload.students))
        return payload.students;

    if (payload && Array.isArray(payload.results))
        return payload.results;

    return [];
}

async function loadStudents() {

    const body = document.getElementById("studentsBody");

    body.innerHTML =
        '<tr><td colspan="8" class="loading">A carregar alunos...</td></tr>';

    try {

        const response = await fetch(API, {
            credentials: "same-origin"
        });

        if (response.status === 401 || response.status === 403) {
            showToast("Sessão expirada. Faça login novamente.", "error");
            return;
        }

        const payload = await response.json();

        if (!response.ok) {
            throw new Error(
                payload.message ||
                payload.error ||
                "Erro ao carregar alunos."
            );
        }

        students = extractList(payload);

        updateStats();
        render();

    } catch (error) {

        console.error(error);

        body.innerHTML =
            '<tr><td colspan="8" class="empty">Não foi possível carregar os alunos.</td></tr>';

        showToast(error.message, "error");
    }
}

function updateStats() {

    const total = students.length;

    const active = students.filter(
        s => String(s.status || "").toLowerCase() === "active"
    ).length;

    const inactive = total - active;

    const withRfid = students.filter(
        s => s.rfid_card_id
    ).length;

    document.getElementById("totalStudents").textContent = total;
    document.getElementById("activeStudents").textContent = active;
    document.getElementById("inactiveStudents").textContent = inactive;
    document.getElementById("rfidStudents").textContent = withRfid;
}

function render() {

    const body = document.getElementById("studentsBody");

    const search =
        document.getElementById("search").value
        .trim()
        .toLowerCase();

    const status =
        document.getElementById("statusFilter").value;

    const filtered = students.filter(student => {

        const text = [
            student.student_number,
            student.name,
            student.email,
            student.course,
            student.class_name,
            student.rfid_card_id
        ]
        .join(" ")
        .toLowerCase();

        const matchesSearch =
            !search || text.includes(search);

        const matchesStatus =
            !status ||
            String(student.status || "").toLowerCase() === status;

        return matchesSearch && matchesStatus;
    });

    if (!filtered.length) {

        body.innerHTML =
            '<tr><td colspan="8" class="empty">Nenhum aluno encontrado.</td></tr>';

        return;
    }

    body.innerHTML = filtered.map(student => {

        const active =
            String(student.status || "").toLowerCase() === "active";

        return `
            <tr>

                <td>
                    <strong>${escapeHtml(student.student_number)}</strong>
                </td>

                <td>
                    <strong>${escapeHtml(student.name)}</strong>
                </td>

                <td>${escapeHtml(student.email)}</td>

                <td>${escapeHtml(student.course)}</td>

                <td>${escapeHtml(student.class_name || "—")}</td>

                <td>
                    ${
                        student.rfid_card_id
                        ? `<span class="rfid">${escapeHtml(student.rfid_card_id)}</span>`
                        : "—"
                    }
                </td>

                <td>
                    <span class="badge ${
                        active
                        ? "badge-active"
                        : "badge-inactive"
                    }">
                        ${active ? "Ativo" : "Inativo"}
                    </span>
                </td>

                <td>
                    <div class="actions">

                        <button
                            class="icon-btn btn-light"
                            title="Editar"
                            onclick="openEdit(${Number(student.id)})">
                            ✎
                        </button>

                        <button
                            class="icon-btn btn-danger"
                            title="Eliminar"
                            onclick="deleteStudent(${Number(student.id)})">
                            🗑
                        </button>

                    </div>
                </td>

            </tr>
        `;

    }).join("");
}

function openCreate() {

    document.getElementById("studentForm").reset();

    document.getElementById("studentId").value = "";

    document.getElementById("status").value = "active";

    document.getElementById("modalTitle").textContent =
        "Novo aluno";

    document.getElementById("modal").classList.add("show");
}

function openEdit(id) {

    const student = students.find(
        s => Number(s.id) === Number(id)
    );

    if (!student) {
        showToast("Aluno não encontrado.", "error");
        return;
    }

    document.getElementById("studentId").value =
        student.id ?? "";

    document.getElementById("student_number").value =
        student.student_number ?? "";

    document.getElementById("name").value =
        student.name ?? "";

    document.getElementById("email").value =
        student.email ?? "";

    document.getElementById("course").value =
        student.course ?? "";

    document.getElementById("class_name").value =
        student.class_name ?? "";

    document.getElementById("rfid_card_id").value =
        student.rfid_card_id ?? "";

    document.getElementById("status").value =
        student.status || "active";

    document.getElementById("modalTitle").textContent =
        "Editar aluno";

    document.getElementById("modal").classList.add("show");
}

function closeModal() {
    document.getElementById("modal").classList.remove("show");
}

async function saveStudent() {

    const form = document.getElementById("studentForm");

    if (!form.reportValidity())
        return;

    const id =
        document.getElementById("studentId").value;

    const payload = {

        student_number:
            document.getElementById("student_number").value.trim(),

        name:
            document.getElementById("name").value.trim(),

        email:
            document.getElementById("email").value.trim(),

        course:
            document.getElementById("course").value.trim(),

        class_name:
            document.getElementById("class_name").value.trim(),

        rfid_card_id:
            document.getElementById("rfid_card_id").value.trim(),

        status:
            document.getElementById("status").value

    };

    const url = id
        ? API + encodeURIComponent(id)
        : API;

    const method = id ? "PUT" : "POST";

    try {

        const response = await fetch(url, {

            method,

            headers: {
                "Content-Type": "application/json"
            },

            credentials: "same-origin",

            body: JSON.stringify(payload)
        });

        const data = await response.json();

        if (!response.ok) {

            throw new Error(
                data.message ||
                data.error ||
                "Não foi possível guardar o aluno."
            );
        }

        closeModal();

        showToast(
            id
            ? "Aluno atualizado com sucesso."
            : "Aluno criado com sucesso.",
            "success"
        );

        await loadStudents();

    } catch (error) {

        console.error(error);

        showToast(error.message, "error");
    }
}

async function deleteStudent(id) {

    const student = students.find(
        s => Number(s.id) === Number(id)
    );

    if (!student)
        return;

    const confirmed = confirm(
        `Deseja realmente eliminar o aluno "${student.name}"?`
    );

    if (!confirmed)
        return;

    try {

        const response = await fetch(
            API + encodeURIComponent(id),
            {
                method: "DELETE",
                credentials: "same-origin"
            }
        );

        const data = await response.json();

        if (!response.ok) {

            throw new Error(
                data.message ||
                data.error ||
                "Não foi possível eliminar o aluno."
            );
        }

        showToast(
            "Aluno eliminado com sucesso.",
            "success"
        );

        await loadStudents();

    } catch (error) {

        console.error(error);

        showToast(error.message, "error");
    }
}

document.getElementById("modal").addEventListener(
    "click",
    event => {
        if (event.target.id === "modal")
            closeModal();
    }
);

loadStudents();

</script>

</body>
</html>
