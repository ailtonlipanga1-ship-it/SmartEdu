<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SmartEdu | Histórico de Acessos</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Segoe UI,Arial,sans-serif;background:#f4f7fb;color:#172033}
.header{height:72px;background:#fff;border-bottom:1px solid #e5eaf1;display:flex;align-items:center;justify-content:space-between;padding:0 32px}
.brand{display:flex;align-items:center;gap:12px;font-size:21px;font-weight:800}
.logo{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,#2563eb,#7c3aed);color:#fff;display:grid;place-items:center}
.container{max-width:1500px;margin:auto;padding:30px}
.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:25px}
h1{font-size:30px}
.muted{color:#718096;margin-top:6px}
.btn{border:0;border-radius:10px;padding:11px 17px;font-weight:700;cursor:pointer}
.light{background:#eef2f7;color:#334155}
.primary{background:#2563eb;color:#fff}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin-bottom:25px}
.stat{background:#fff;border:1px solid #e5eaf1;border-radius:18px;padding:22px;box-shadow:0 12px 35px #0f172a10}
.stat span{color:#718096;font-size:14px}
.stat strong{display:block;font-size:29px;margin-top:8px}
.panel{background:#fff;border:1px solid #e5eaf1;border-radius:18px;box-shadow:0 12px 35px #0f172a10;overflow:hidden}
.toolbar{padding:20px;border-bottom:1px solid #e5eaf1;display:flex;gap:10px;flex-wrap:wrap}
.input,.select{height:44px;border:1px solid #dbe2ea;border-radius:10px;padding:0 12px;outline:0;background:white}
.search{flex:1;min-width:220px}
.table-wrap{overflow:auto}
table{width:100%;border-collapse:collapse;min-width:1000px}
th,td{padding:15px 17px;border-bottom:1px solid #e5eaf1;text-align:left}
th{background:#f8fafc;color:#64748b;font-size:12px;text-transform:uppercase}
.uid{font-family:Consolas,monospace;background:#f1f5f9;padding:5px 8px;border-radius:7px}
.badge{padding:6px 10px;border-radius:999px;font-size:12px;font-weight:700}
.granted{background:#dcfce7;color:#166534}
.denied{background:#fee2e2;color:#991b1b}
.entry{background:#dbeafe;color:#1e40af}
.exit{background:#fef3c7;color:#92400e}
.empty{text-align:center;padding:55px;color:#718096}
</style>
</head>

<body>

<header class="header">
<div class="brand"><div class="logo">S</div>SmartEdu</div>
<button class="btn light" onclick="location.href='/dashboard/'">Dashboard</button>
</header>

<main class="container">

<div class="head">
<div>
<h1>Histórico de Acessos</h1>
<p class="muted">Registo permanente das entradas e saídas realizadas pelo sistema RFID.</p>
</div>
<button class="btn primary" onclick="load()">↻ Atualizar</button>
</div>

<div class="stats">
<div class="stat"><span>Total de eventos</span><strong id="total">0</strong></div>
<div class="stat"><span>Acessos autorizados</span><strong id="granted">0</strong></div>
<div class="stat"><span>Acessos negados</span><strong id="denied">0</strong></div>
<div class="stat"><span>Taxa de autorização</span><strong id="rate">0%</strong></div>
</div>

<section class="panel">

<div class="toolbar">
<input id="search" class="input search" placeholder="Pesquisar UID, dispositivo ou motivo..." oninput="render()">

<select id="result" class="select" onchange="load()">
<option value="">Todos os resultados</option>
<option value="granted">Autorizados</option>
<option value="denied">Negados</option>
</select>

<select id="direction" class="select" onchange="load()">
<option value="">Entrada e saída</option>
<option value="entry">Entrada</option>
<option value="exit">Saída</option>
</select>

<button class="btn light" onclick="clearFilters()">Limpar filtros</button>
</div>

<div class="table-wrap">
<table>
<thead>
<tr>
<th>Data/Hora</th>
<th>UID</th>
<th>Direção</th>
<th>Resultado</th>
<th>Dispositivo</th>
<th>Aluno</th>
<th>Professor</th>
<th>Motivo</th>
</tr>
</thead>
<tbody id="body"></tbody>
</table>
</div>

</section>
</main>

<script>
const API="/api/v1/access/";
let logs=[];

function extract(x){
if(Array.isArray(x))return x;
if(Array.isArray(x?.data))return x.data;
if(Array.isArray(x?.events))return x.events;
if(Array.isArray(x?.access_logs))return x.access_logs;
if(Array.isArray(x?.results))return x.results;
if(Array.isArray(x?.data?.events))return x.data.events;
return [];
}

function updateStats(){
const total=logs.length;
const granted=logs.filter(x=>x.result==="granted").length;
const denied=logs.filter(x=>x.result==="denied").length;

document.getElementById("total").textContent=total;
document.getElementById("granted").textContent=granted;
document.getElementById("denied").textContent=denied;
document.getElementById("rate").textContent=
total?((granted/total)*100).toFixed(1)+"%":"0%";
}

function render(){

const q=document.getElementById("search").value.toLowerCase().trim();

const list=logs.filter(x=>{
const text=[
x.card_uid,
x.device_code,
x.reason,
x.student_id,
x.teacher_id
].join(" ").toLowerCase();

return !q||text.includes(q);
});

const body=document.getElementById("body");

if(!list.length){
body.innerHTML='<tr><td colspan="8" class="empty">Nenhum evento encontrado.</td></tr>';
return;
}

body.innerHTML=list.map(x=>{

const granted=x.result==="granted";
const entry=x.direction==="entry";

return `<tr>
<td>${x.timestamp?new Date(x.timestamp).toLocaleString("pt-PT"):"—"}</td>
<td><span class="uid">${esc(x.card_uid||"—")}</span></td>
<td><span class="badge ${entry?"entry":"exit"}">${entry?"Entrada":"Saída"}</span></td>
<td><span class="badge ${granted?"granted":"denied"}">${granted?"Autorizado":"Negado"}</span></td>
<td>${esc(x.device_code||"—")}</td>
<td>${x.student_id??"—"}</td>
<td>${x.teacher_id??"—"}</td>
<td>${esc(x.reason||"Acesso autorizado")}</td>
</tr>`;

}).join("");
}

function esc(v){
return String(v??"")
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;");
}

async function load(){

const params=new URLSearchParams();

const result=document.getElementById("result").value;
const direction=document.getElementById("direction").value;

if(result)params.set("result",result);
if(direction)params.set("direction",direction);

params.set("limit","500");

try{

const r=await fetch(API+"?"+params.toString(),{
credentials:"same-origin"
});

const d=await r.json();

if(!r.ok)
throw Error(d.message||d.error||"Erro ao carregar histórico.");

logs=extract(d);

updateStats();
render();

}catch(e){

console.error(e);

document.getElementById("body").innerHTML=
'<tr><td colspan="8" class="empty">Erro ao carregar histórico.</td></tr>';
}
}

function clearFilters(){
document.getElementById("search").value="";
document.getElementById("result").value="";
document.getElementById("direction").value="";
load();
}

load();

setInterval(load,30000);
</script>

</body>
</html>
