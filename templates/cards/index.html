<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SmartEdu | Cartões RFID</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Segoe UI,Arial;background:#f4f7fb;color:#172033}
.header{height:72px;background:#fff;border-bottom:1px solid #e5eaf1;display:flex;align-items:center;justify-content:space-between;padding:0 32px}
.brand{display:flex;gap:12px;align-items:center;font-weight:800;font-size:21px}
.logo{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,#2563eb,#7c3aed);color:#fff;display:grid;place-items:center}
.container{max-width:1450px;margin:auto;padding:30px}
.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:25px}
h1{font-size:30px}.muted{color:#718096;margin-top:6px}
.btn{border:0;border-radius:10px;padding:11px 17px;font-weight:700;cursor:pointer}
.primary{background:#2563eb;color:#fff}.light{background:#eef2f7;color:#334155}
.danger{background:#fee2e2;color:#991b1b}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin-bottom:25px}
.stat,.panel{background:#fff;border:1px solid #e5eaf1;border-radius:18px;box-shadow:0 12px 35px #0f172a12}
.stat{padding:22px}.stat span{font-size:14px;color:#718096}.stat strong{display:block;font-size:30px;margin-top:8px}
.toolbar{padding:20px;border-bottom:1px solid #e5eaf1;display:flex;gap:12px}
.input,.select{height:44px;border:1px solid #dbe2ea;border-radius:10px;padding:0 12px;outline:0}.search{flex:1}
.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:850px}
th,td{padding:16px;border-bottom:1px solid #e5eaf1;text-align:left}
th{font-size:12px;color:#64748b;background:#f8fafc;text-transform:uppercase}
.uid{font-family:Consolas,monospace;background:#eef2f7;padding:6px 9px;border-radius:7px}
.badge{padding:6px 10px;border-radius:999px;font-size:12px;font-weight:700}
.active{background:#dcfce7;color:#166534}.blocked{background:#fee2e2;color:#991b1b}.inactive{background:#fef3c7;color:#92400e}
.modal{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;padding:20px}.modal.show{display:flex}
.box{background:white;border-radius:18px;width:100%;max-width:700px}.modalhead{padding:20px;border-bottom:1px solid #eee;display:flex;justify-content:space-between}
.close{border:0;background:#eee;border-radius:8px;padding:8px 12px}.form{padding:22px;display:grid;grid-template-columns:1fr 1fr;gap:15px}
.field{display:flex;flex-direction:column;gap:6px}.full{grid-column:1/-1}.field input,.field select{height:44px;border:1px solid #dbe2ea;border-radius:9px;padding:0 10px}
.foot{padding:18px 22px;border-top:1px solid #eee;text-align:right}
.toast{position:fixed;right:25px;bottom:25px;background:#172033;color:#fff;padding:15px 20px;border-radius:10px;display:none}.toast.show{display:block}
@media(max-width:900px){.stats{grid-template-columns:repeat(2,1fr)}}@media(max-width:600px){.stats{grid-template-columns:1fr}.form{grid-template-columns:1fr}.full{grid-column:auto}.head{flex-direction:column;align-items:flex-start}}
</style>
</head>
<body>

<header class="header">
<div class="brand"><div class="logo">S</div>SmartEdu</div>
<button class="btn light" onclick="location.href='/dashboard/'">Dashboard</button>
</header>

<main class="container">
<div class="head">
<div><h1>Cartões RFID</h1><p class="muted">Registo, associação, estado e controlo dos cartões.</p></div>
<button class="btn primary" onclick="openCreate()">+ Registar cartão</button>
</div>

<div class="stats">
<div class="stat"><span>Total</span><strong id="total">0</strong></div>
<div class="stat"><span>Ativos</span><strong id="active">0</strong></div>
<div class="stat"><span>Bloqueados</span><strong id="blocked">0</strong></div>
<div class="stat"><span>Inativos</span><strong id="inactive">0</strong></div>
</div>

<section class="panel">
<div class="toolbar">
<input id="search" class="input search" placeholder="Pesquisar UID ou titular..." oninput="render()">
<select id="filter" class="select" onchange="render()">
<option value="">Todos</option><option value="active">Ativos</option><option value="blocked">Bloqueados</option><option value="inactive">Inativos</option>
</select>
<button class="btn light" onclick="load()">↻ Atualizar</button>
</div>
<div class="table-wrap">
<table>
<thead><tr><th>UID</th><th>Tipo</th><th>Titular</th><th>Estado</th><th>Último acesso</th><th>Ações</th></tr></thead>
<tbody id="body"></tbody>
</table>
</div>
</section>
</main>

<div id="modal" class="modal">
<div class="box">
<div class="modalhead"><h2 id="title">Registar cartão</h2><button class="close" onclick="closeModal()">×</button></div>
<form id="form" class="form">
<input type="hidden" id="id">
<div class="field full"><label>UID RFID *</label><input id="uid" required placeholder="Ex.: RFID-001"></div>
<div class="field"><label>Tipo de titular *</label><select id="holder_type"><option value="student">Aluno</option><option value="teacher">Professor</option></select></div>
<div class="field"><label>ID do titular *</label><input id="holder_id" required></div>
<div class="field full"><label>Estado</label><select id="status"><option value="active">Ativo</option><option value="blocked">Bloqueado</option><option value="inactive">Inativo</option></select></div>
</form>
<div class="foot"><button class="btn light" onclick="closeModal()">Cancelar</button> <button class="btn primary" onclick="save()">Guardar</button></div>
</div>
</div>

<div id="toast" class="toast"></div>

<script>
const API="/api/v1/cards/";
let cards=[];

function toast(m){const t=document.getElementById("toast");t.textContent=m;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),3000)}
function esc(v){return String(v??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;")}
function extract(x){if(Array.isArray(x))return x;if(Array.isArray(x?.data))return x.data;if(Array.isArray(x?.cards))return x.cards;if(Array.isArray(x?.results))return x.results;if(Array.isArray(x?.data?.cards))return x.data.cards;return []}

async function load(){
try{
const r=await fetch(API,{credentials:"same-origin"});const d=await r.json();
if(!r.ok)throw Error(d.message||d.error||"Erro ao carregar cartões.");
cards=extract(d);stats();render();
}catch(e){toast(e.message)}
}

function stats(){
const total=cards.length;
const active=cards.filter(x=>String(x.status||"").toLowerCase()=="active").length;
const blocked=cards.filter(x=>String(x.status||"").toLowerCase()=="blocked").length;
document.getElementById("total").textContent=total;
document.getElementById("active").textContent=active;
document.getElementById("blocked").textContent=blocked;
document.getElementById("inactive").textContent=total-active-blocked;
}

function render(){
const q=document.getElementById("search").value.toLowerCase().trim();
const f=document.getElementById("filter").value;
const list=cards.filter(x=>{
const text=[x.uid,x.holder_type,x.holder_id].join(" ").toLowerCase();
return(!q||text.includes(q))&&(!f||String(x.status||"").toLowerCase()==f);
});
const b=document.getElementById("body");
if(!list.length){b.innerHTML='<tr><td colspan="6" style="text-align:center;padding:50px;color:#718096">Nenhum cartão encontrado.</td></tr>';return}
b.innerHTML=list.map(x=>{
const status=String(x.status||"").toLowerCase();
return `<tr>
<td><span class="uid">${esc(x.uid)}</span></td>
<td>${x.holder_type=="student"?"Aluno":"Professor"}</td>
<td>${esc(x.holder_id)}</td>
<td><span class="badge ${status}">${status=="active"?"Ativo":status=="blocked"?"Bloqueado":"Inativo"}</span></td>
<td>${x.last_seen?new Date(x.last_seen).toLocaleString("pt-PT"):"Nunca"}</td>
<td><button class="btn light" onclick="edit(${Number(x.id)})">Editar</button> <button class="btn danger" onclick="removeCard(${Number(x.id)})">Eliminar</button></td>
</tr>`;
}).join("");
}

function openCreate(){
document.getElementById("form").reset();document.getElementById("id").value="";
document.getElementById("status").value="active";document.getElementById("title").textContent="Registar cartão";
document.getElementById("modal").classList.add("show");
}

function edit(id){
const x=cards.find(v=>Number(v.id)==Number(id));if(!x)return;
document.getElementById("id").value=x.id;document.getElementById("uid").value=x.uid||"";
document.getElementById("holder_type").value=x.holder_type||"student";document.getElementById("holder_id").value=x.holder_id||"";
document.getElementById("status").value=x.status||"active";document.getElementById("title").textContent="Editar cartão";
document.getElementById("modal").classList.add("show");
}

function closeModal(){document.getElementById("modal").classList.remove("show")}

async function save(){
const f=document.getElementById("form");if(!f.reportValidity())return;
const id=document.getElementById("id").value;
const payload={uid:document.getElementById("uid").value.trim(),holder_type:document.getElementById("holder_type").value,holder_id:document.getElementById("holder_id").value.trim(),status:document.getElementById("status").value};
try{
const r=await fetch(id?API+id:API,{method:id?"PUT":"POST",headers:{"Content-Type":"application/json"},credentials:"same-origin",body:JSON.stringify(payload)});
const d=await r.json();if(!r.ok)throw Error(d.message||d.error||"Erro ao guardar cartão.");
closeModal();toast(id?"Cartão atualizado.":"Cartão registado.");await load();
}catch(e){toast(e.message)}
}

async function removeCard(id){
if(!confirm("Eliminar este cartão? O histórico de acessos deve permanecer preservado."))return;
try{
const r=await fetch(API+id,{method:"DELETE",credentials:"same-origin"});const d=await r.json();
if(!r.ok)throw Error(d.message||d.error||"Erro ao eliminar.");
toast("Cartão eliminado.");await load();
}catch(e){toast(e.message)}
}
load();
</script>
</body>
</html>
